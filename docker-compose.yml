services:
  notifier:
    image: ghcr.io/rickhehe/tg-channel-ozbargain:latest
    pull_policy: always
    env_file:
      - .env
    environment:
      ANCHOR_FILE: /data/anchor.txt
      CLASSIFIER_CACHE_FILE: /data/classifier_cache.json
      CLASSIFIER_EVAL_LOG_FILE: /data/classifier_eval_log.jsonl
    volumes:
      - ./data:/data
    restart: "no"
